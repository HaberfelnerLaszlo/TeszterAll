version: '3.4'

services:
  webapp:
    image: haberfelner/teszter:latest
    ports:
      - 5100:80
      - 7100:8081
    environment:
      - ASPNETCORE_HTTPS_PORT=8081
      - ASPNETCORE_URLS=https://+:8081;http://+
      - ASPNETCORE_Kestrel__Certificates__Default__Password=pass
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ~/.aspnet/https:/https:ro
      - C:/Games:/home/app/.aspnet/DataProtection-Keys
      # A feltöltött képek (App_Data/uploads) kötetben: újratelepítéskor sem vesznek el.
      # Tulajdonos: az "app" felhasználó (UID 1654), lásd: chown -R 1654:1654.
      - teszter-uploads:/app/App_Data/uploads

volumes:
  teszter-uploads:
    name: teszter-uploads   # rögzített név (a compose különben a mappanévvel előtagolná)
