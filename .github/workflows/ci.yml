# Folyamatos integráció: visszaállítás, fordítás és tesztek minden push-ra és pull requestre.
#
# A Teszter almodult (privát Azure DevOps repó, az API forrása) szándékosan NEM töltjük le:
# a TeszterWeb/TeszterLibrary/TeszterTests nem hivatkozik rá. A megoldásfájlt sem fordítjuk,
# mert a docker-compose.dcproj Linuxon nem fordítható; helyette a projekteket egyenként.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Visszaállítás
        run: |
          dotnet restore TeszterWeb/TeszterWeb.csproj
          dotnet restore TeszterTests/TeszterTests.csproj

      - name: Fordítás
        run: |
          dotnet build TeszterWeb/TeszterWeb.csproj --no-restore --configuration Release
          dotnet build TeszterTests/TeszterTests.csproj --no-restore --configuration Release

      - name: Tesztek
        run: >
          dotnet test TeszterTests/TeszterTests.csproj --no-build --configuration Release
          --logger "trx;LogFileName=tesztek.trx" --results-directory TestResults

      - name: Teszteredmények feltöltése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teszteredmenyek
          path: TestResults/*.trx
          if-no-files-found: ignore
